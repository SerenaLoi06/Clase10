<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi página</title>
   <!--esto lo traje de Google Fonts-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <style>
      body{ 
	      font-family: "Space Grotesk", sans-serif;
      }
  </style>
  <link rel="stylesheet" href="styles.css">
</head>
<body>


  <script src="script.js"></script>
  <!--aca esta el svg-->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-label="Gráfico radar de indicadores académicos">
  <style>
    .bg       { fill: #fff; }
    .ring     { fill: none; stroke: #d3d3d3; stroke-width: 1; }
    .axis     { stroke: #999; stroke-width: 1; }
    .label    { font: 13px Arial, sans-serif; fill: #222; }
    .tick     { font: 10px Arial, sans-serif; fill: #666; text-anchor: end; }
    .area     { fill-opacity: 0.2;transition:all ease .4s; }
	.area:hover     { fill-opacity: 0.4;transition:all ease .4s; }
    .s0       { fill: #1f77b4; stroke: #1f77b4; }
    .s1       { fill: #ff7f0e; stroke: #ff7f0e; }
    .s2       { fill: #2ca02c; stroke: #2ca02c; }
    .s3       { fill: #d62728; stroke: #d62728; }
  </style>

  <rect class="bg" width="900" height="640"/>

  <!-- Centro del gráfico; radio 285 = 100 -->
  <g transform="translate(450, 320)">

    <!-- Anillos de la cuadrícula (10 a 100) -->
    <g>
      <circle class="ring" r="28.5"/>
      <circle class="ring" r="57"/>
      <circle class="ring" r="85.5"/>
      <circle class="ring" r="114"/>
      <circle class="ring" r="142.5"/>
      <circle class="ring" r="171"/>
      <circle class="ring" r="199.5"/>
      <circle class="ring" r="228"/>
      <circle class="ring" r="256.5"/>
      <circle class="ring" r="285"/>
    </g>

    <!-- Ejes -->
    <g>
      <line class="axis" x2="0"        y2="-285"/>
      <line class="axis" x2="246.8"    y2="-142.5"/>
      <line class="axis" x2="246.8"    y2="142.5"/>
      <line class="axis" x2="0"        y2="285"/>
      <line class="axis" x2="-246.8"   y2="142.5"/>
      <line class="axis" x2="-246.8"   y2="-142.5"/>
    </g>

    <!-- Escala (0 a 100) -->
    <g>
      <text class="tick" x="-6" y="3">0</text>
      <text class="tick" x="-6" y="-26">10</text>
      <text class="tick" x="-6" y="-54">20</text>
      <text class="tick" x="-6" y="-83">30</text>
      <text class="tick" x="-6" y="-111">40</text>
      <text class="tick" x="-6" y="-140">50</text>
      <text class="tick" x="-6" y="-168">60</text>
      <text class="tick" x="-6" y="-197">70</text>
      <text class="tick" x="-6" y="-225">80</text>
      <text class="tick" x="-6" y="-254">90</text>
      <text class="tick" x="-6" y="-282">100</text>
    </g>

    <!-- Etiquetas de los ejes -->
    <g>
      <text class="label" x="0"    y="-298" text-anchor="middle">Staff with PhD</text>
      <text class="label" x="262"  y="-142" text-anchor="start" dominant-baseline="middle">Academic Reputation</text>
      <text class="label" x="262"  y="142"  text-anchor="start" dominant-baseline="middle">International Research Network</text>
      <text class="label" x="0"    y="308"  text-anchor="middle">Papers Per Faculty</text>
      <text class="label" x="-262" y="142"  text-anchor="end"   dominant-baseline="middle">Citations per Paper</text>
      <text class="label" x="-262" y="-142" text-anchor="end"   dominant-baseline="middle">Faculty Student</text>
    </g>

    <!-- Series (orden de puntos: arriba, der-arriba, der-abajo, abajo, izq-abajo, izq-arriba) -->
    <polygon class="area s0" points="0,-281 246.8,-142.5 246,142 0,278 -191.4,110.5 -177.5,-102.5"/>
    <polygon class="area s1" points="0,-205 246.8,-142.5 246,142 0,284 -189.7,109.5 -57.2,-33"/>
    <polygon class="area s2" points="0,-182 222.6,-128.5 244.2,141 0,255 -217.4,125.5 -92.7,-53.5"/>
    <polygon class="area s3" points="0,-84 234.7,-135.5 241.6,139.5 0,231 -150.7,87 -73.6,-42.5"/>
  </g>
</svg>
</body>
</html>
